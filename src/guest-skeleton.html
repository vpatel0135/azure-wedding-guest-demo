.guest-live-photo-hashtag span{display:block;}
.guest-live-photo-hashtag strong{display:block; margin-top:3px; color:var(--g-coral-dim); font-size:19px; line-height:1.2; letter-spacing:.025em;}
.guest-live-seating-wrap{max-width:640px;margin:0 auto;padding:0 24px 18px;}
.guest-live-seating-card{text-align:center;padding:22px;border-radius:var(--g-feature-radius);color:#fff;background:linear-gradient(145deg,#173c39,#245a54);box-shadow:0 16px 34px -20px rgba(19,58,54,.62);}
.guest-live-seating-eyebrow{display:flex;justify-content:center;align-items:center;gap:7px;color:#d9c8a8;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;}
.guest-live-seating-eyebrow span{width:7px;height:7px;border-radius:50%;background:#d8bd82;box-shadow:0 0 0 5px rgba(216,189,130,.15);}
.guest-live-seating-card h2{font-family:var(--g-serif);font-size:24px;font-weight:400;margin:10px 0 7px;color:#fff;}
.guest-live-seating-card p{max-width:410px;margin:0 auto 16px;color:#e7dfcf;font-size:13px;line-height:1.55;}
.guest-live-seating-button{display:flex;align-items:center;justify-content:center;gap:8px;max-width:420px;min-height:48px;margin:0 auto;border-radius:12px;background:#fff;color:#173c39;text-decoration:none;font-size:14px;font-weight:800;}
.guest-live-seating-button svg{width:16px;height:16px;}

/* MEHNDI_HAS NO LENSE LINK YET: subdued, non-interactive counterpart to
   .guest-live-photo-card — neutral dashed border, muted icon/eyebrow, and
   a real disabled <button> (not a link) so it can never be tapped or
   open Lense. */
.guest-live-photo-card.is-disabled{border:1px dashed var(--g-line); background:var(--g-card); box-shadow:none;}
.guest-live-photo-card.is-disabled .guest-live-photo-eyebrow{color:var(--g-ink-faint);}
.guest-live-photo-card.is-disabled .guest-live-photo-eyebrow span{background:var(--g-ink-faint); box-shadow:0 0 0 5px color-mix(in srgb,var(--g-ink-faint) 18%,transparent);}
.guest-live-photo-card.is-disabled .guest-live-photo-icon{color:var(--g-ink-faint); background:color-mix(in srgb,var(--g-ink-faint) 14%,transparent);}
.guest-live-photo-card.is-disabled .guest-live-photo-button{background:var(--g-line); color:var(--g-ink-faint); box-shadow:none; cursor:not-allowed; border:none;}
.guest-live-photo-card.is-disabled .guest-live-photo-button:hover{filter:none;}

/* Paired actions band (requirement 9): "View Your Schedule" and "Share
   Your Photos" as matched-weight cards immediately below the hero, so
   they read as one paired call-to-action rather than a lone hero button
   followed by a much heavier standalone photo section further down. */
.guest-actions-pair{
  max-width:640px; margin:0 auto; padding:0 24px 40px;
  display:grid; grid-template-columns:1fr; gap:12px;
}
@media (min-width:480px){
  .guest-actions-pair{grid-template-columns:1fr 1fr;}
}
.guest-action-card{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  width:100%; box-sizing:border-box; appearance:none; font:inherit; cursor:pointer;
  padding:24px 18px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--g-coral) 13%,transparent),color-mix(in srgb,var(--g-rose) 8%,transparent) 60%,var(--g-card));
  border:1px solid color-mix(in srgb,var(--g-coral) 26%,transparent); border-radius:var(--g-feature-radius);
  position:relative; overflow:hidden;
  box-shadow:var(--g-card-shadow);
  transition:transform .2s var(--ease), box-shadow .2s var(--ease);
}
.guest-action-card:hover{transform:translateY(-2px); box-shadow:0 18px 32px -22px rgba(16,68,128,0.38);}
.guest-action-card.is-photo{
  background:linear-gradient(160deg,color-mix(in srgb,var(--g-coral) 18%,transparent),color-mix(in srgb,var(--g-rose) 9%,transparent) 60%,var(--g-card));
  border-color:color-mix(in srgb,var(--g-coral) 30%,transparent);
  box-shadow:var(--g-card-shadow);
}
.guest-action-card.is-photo:hover{box-shadow:0 18px 32px -22px rgba(16,68,128,0.38);}
.guest-action-icon-badge{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb,var(--g-gold) 14%,transparent); color:var(--g-gold-dim); margin-bottom:10px;
}
.guest-action-icon-badge svg{width:20px; height:20px;}
.guest-action-card.is-photo .guest-action-icon-badge{background:color-mix(in srgb,var(--g-coral) 16%,transparent); color:var(--g-coral-dim);}
.guest-action-title{font-size:14.5px; font-weight:700; color:var(--g-ink); letter-spacing:.01em;}
.guest-action-sub{font-size:12px; color:var(--g-ink-faint); margin-top:3px;}
.guest-action-sub [data-hashtag-text]{display:block; margin-top:3px; color:var(--g-coral-dim); font-size:16px; font-weight:800; letter-spacing:.02em;}

.guest-transport-list{display:flex; flex-direction:column; gap:1px; background:var(--g-line); border:1px solid var(--g-line); border-radius:var(--g-card-radius); overflow:hidden; box-shadow:var(--g-card-shadow);}
.guest-transport-card{background:var(--g-card); padding:18px 20px;}
.guest-transport-route{font-family:var(--g-serif); font-size:16.5px; color:var(--g-ink);}
.guest-transport-time{font-size:12.5px; color:var(--g-ink-faint); margin-top:4px;}
.guest-transport-note{font-size:13px; color:var(--g-ink-dim); line-height:1.55; margin-top:8px;}

.guest-day{max-width:640px; margin:0 auto 44px;}
.guest-day:last-child{margin-bottom:0;}
.guest-day-label{
  font-family:var(--g-serif); font-size:19px; color:var(--g-gold-dim); margin-bottom:18px;
  padding-bottom:10px; border-bottom:1px solid var(--g-rose); border-bottom-color:rgba(129,183,245,0.35);
}
/* Guest Schedule event picker (requirement 10: progressive disclosure —
   events grouped/ordered by date, each card a factual public summary
   only; selecting one is the single decision that matters first). */
.guest-events-grid{display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:560px){ .guest-events-grid{grid-template-columns:1fr 1fr;} }
.guest-event-pick-card{
  display:block; width:100%; box-sizing:border-box; appearance:none; font:inherit; cursor:pointer;
  text-align:left; padding:18px 20px;
  background:var(--g-card); border:1px solid var(--g-line); border-radius:var(--g-card-radius); box-shadow:var(--g-card-shadow);
  position:relative; transition:transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
}
.guest-event-pick-card:hover{transform:translateY(-2px); box-shadow:0 14px 26px -22px rgba(16,68,128,0.32); border-color:rgba(61,139,255,0.38);}
.guest-event-pick-card.is-live{border-color:color-mix(in srgb,var(--g-coral-dim) 45%,transparent); background:linear-gradient(160deg,color-mix(in srgb,var(--g-coral) 10%,transparent),var(--g-card) 55%);}
.guest-live-pill{
  display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--g-coral-dim); margin-bottom:8px;
}
.guest-live-dot{
  width:6px; height:6px; border-radius:50%; background:var(--g-coral-dim);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--g-coral) 18%,transparent); animation:livePulse 1.8s ease-in-out infinite;
}
.guest-event-pick-title{font-family:var(--g-serif); font-size:18px; color:var(--g-ink); margin-bottom:4px;}
.guest-event-pick-sub{font-size:12.5px; color:var(--g-ink-dim);}
.guest-event-pick-count{font-size:11.5px; color:var(--g-ink-faint); margin-top:8px;}

.guest-schedule-back{
  display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer;
  color:var(--g-ink-dim); font-size:12.5px; font-weight:600; letter-spacing:.02em; margin-bottom:16px; padding:0;
}
.guest-schedule-back svg{width:14px; height:14px; transform:rotate(180deg);}
.guest-schedule-back:hover{color:var(--g-ink);}
/* GUEST EVENT-DETAIL HIERARCHY REFINEMENT (2026-08-30): the detail page's
   own compact header (Back + eyebrow + event name/date/time/location) —
   less top padding than the plain .guest-section-top used by the
   event-picker page, since Back/eyebrow/title now read as one tight
   header unit rather than a full page-opening hero. */
.guest-section.guest-schedule-detail-top{padding-top:40px;}

/* RESPONSIVE PHOTO CTA redesign (2026-08-29): the previous single-line
   inline-flex pill squeezed three competing items (icon, "Share Your
   Photos — Tap to Copy" text, and the hashtag) into one row, which wrapped
   awkwardly at 360–430px. Now a two-row card: a top row for the icon +
   label, a second row for the "Tap to copy" instruction + a visually
   prominent hashtag — never a card as loud as the schedule itself
   (requirement 10 still holds; this is a light-bordered, not filled,
   surface), but roomy enough to stay legible and comfortable to tap
   (generous padding, min-height beyond the 44px tap-target minimum) at
   any phone width. */
.guest-schedule-photo-nudge-wrap{max-width:420px; margin:8px auto 0; padding:0 20px 40px;}
.guest-schedule-photo-nudge{
  display:flex; flex-direction:column; align-items:center; gap:6px; width:100%;
  background:var(--g-card); appearance:none; font:inherit; cursor:pointer;
  border:1px solid var(--g-line); border-radius:16px; padding:14px 18px;
  text-align:center; min-height:44px;
  transition:border-color .2s var(--ease), background .2s var(--ease);
}
.guest-schedule-photo-nudge-row{display:flex; align-items:center; gap:8px;}
.guest-schedule-photo-nudge-icon{display:flex; color:var(--g-coral-dim);}
.guest-schedule-photo-nudge-icon svg{width:15px; height:15px;}
.guest-schedule-photo-nudge-label{font-size:14px; font-weight:700; color:var(--g-ink); letter-spacing:.01em;}
.guest-schedule-photo-nudge-tag-row{display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap; gap:6px;}
.guest-schedule-photo-nudge-tap{font-size:11.5px; font-weight:600; color:var(--g-ink-faint);}
.guest-schedule-photo-nudge-hashtag{font-size:16px; font-weight:800; letter-spacing:.02em; color:var(--g-coral-dim); overflow-wrap:anywhere;}
.guest-schedule-photo-nudge:hover{border-color:rgba(61,139,255,0.38); background:rgba(61,139,255,0.08);}

.guest-event{margin-bottom:26px;}
.guest-event:last-child{margin-bottom:0;}
.guest-event-head{margin-bottom:10px;}
.guest-event-title{font-family:var(--g-serif); font-size:19px; color:var(--g-ink);}
.guest-event-date{font-size:13px; color:var(--g-gold-dim); font-weight:600; margin-top:3px;}
.guest-event-meta{font-size:12.5px; color:var(--g-ink-faint); margin-top:2px;}
/* Bounded schedule panel (GUEST EVENT-DETAIL HIERARCHY REFINEMENT,
   2026-08-30): wraps .guest-moments in one card so the schedule reads as
   the page's clear primary content — not a bare list floating on the
   page background — matching the restraint of the Home hero's own
   .guest-vidhi-module panel. */
.guest-schedule-panel{
  background:var(--g-card); border:1px solid var(--g-line); border-radius:var(--g-card-radius);
  box-shadow:var(--g-card-shadow); padding:4px 18px; box-sizing:border-box;
}
.guest-schedule-panel + .guest-schedule-panel{margin-top:14px;}
.guest-moments{display:flex; flex-direction:column;}
/* RESPONSIVE SCHEDULE ROW ALIGNMENT fix (2026-08-29): a CSS grid (not a
   wrapping flex row) so the time column is a fixed width shared by every
   row — single times ("6:00 PM") and normalized ranges
   ("12:00 PM – 2:00 PM", now guest-app.js's normalizeTimeLabel() output)
   alike — and the title always starts at the same x position in its own
   column. 136px comfortably fits the longest range text on one line
   (white-space:nowrap below), so the time never wraps character-by-
   character and never pushes the title onto its own row; the title
   column wraps normally (word-wrap, not mid-word) when it needs more
   than one line, which is expected and fine at phone widths. */
.guest-moment{
  display:grid; grid-template-columns:136px 1fr; column-gap:14px; row-gap:4px;
  align-items:baseline; padding:9px 0;
  border-top:1px solid var(--g-line);
}
.guest-moment:first-child{border-top:none;}
.guest-moment-time{font-size:12.5px; color:var(--g-ink-faint); font-weight:600; white-space:nowrap;}
.guest-moment-title{font-size:14.5px; color:var(--g-ink); min-width:0; overflow-wrap:break-word;}
.guest-moment.is-current{position:relative; margin:0 -18px; padding:9px 18px; background:color-mix(in srgb,var(--g-coral) 7%,transparent);}
.guest-moment.is-current::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--g-coral-dim);}
.guest-moment.is-current .guest-moment-time{color:var(--g-coral-dim);}
.guest-moment.is-current .guest-moment-title{font-weight:650;}
/* GUEST EXPANDED PROGRAM correction (2026-08-27): the optional, purely
   informational order-of-events disclosure on a moment whose Sheet row
   carries a guestSubMoments sequence (see guest-app.js). Always drops to
   its own full-width row below the time/title pair, never inline beside
   them — in the title column (grid-column:2), preserving the original
   title-aligned indent the old flex layout produced with margin-left:80px. */
.guest-moment-detail{grid-column:2; margin-left:0;}
.guest-moment-detail > summary{
  font-size:12.5px; color:var(--g-gold-dim); font-weight:600; cursor:pointer; list-style:none;
}
.guest-moment-detail > summary::-webkit-details-marker{display:none;}
.guest-moment-detail > summary::before{content:"+ "; }
.guest-moment-detail[open] > summary::before{content:"– "; }
.guest-moment-detail-list{
  margin:8px 0 2px; padding-left:18px; font-size:13.5px; color:var(--g-ink-faint); line-height:1.6;
}

/* GUEST EVENT-DETAIL HIERARCHY REFINEMENT (2026-08-30): Vidhi's special
   pre-merge structure on its OWN Schedule-detail page — a section label,
   then either a plain .guest-schedule-panel (shared items / the
   post-merge "Together" timeline, using the exact same
   .guest-moments/.guest-moment markup every other event's detail page
   uses) or the two-sides tracks panel below. Not a reuse of the Home
   hero's .guest-vidhi-module/.guest-vidhi-columns (that module shows one
   current+next status per side; this shows each side's FULL, internally
   chronological pre-merge list), but the same visual language: a bounded
   card, a vertical divider between balanced desktop columns, a
   horizontal rule between stacked mobile rows. */
.guest-vidhi-detail-label{
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--g-gold-dim); margin:18px 0 8px;
}
.guest-schedule-panel.guest-vidhi-tracks-panel{padding:0;}
.guest-vidhi-detail-tracks{display:grid; grid-template-columns:1fr;}
@media (min-width:480px){ .guest-vidhi-detail-tracks{grid-template-columns:1fr 1fr;} }
.guest-vidhi-track{padding:14px 18px; box-sizing:border-box;}
@media (min-width:480px){
  .guest-vidhi-track{border-left:1px solid var(--g-line);}
  .guest-vidhi-detail-tracks .guest-vidhi-track:first-child{border-left:none;}
}
.guest-vidhi-track-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--g-gold-dim); margin-bottom:8px;}
.guest-vidhi-track-row{
  display:grid; grid-template-columns:76px 1fr; column-gap:10px;
  align-items:baseline; padding:6px 0; border-top:1px solid var(--g-line);
}
.guest-vidhi-track-label + .guest-vidhi-track-row{border-top:none;}
.guest-vidhi-track-time{font-size:11.5px; color:var(--g-ink-faint); font-weight:600; white-space:nowrap;}
.guest-vidhi-track-title{font-size:13.5px; color:var(--g-ink); min-width:0; overflow-wrap:break-word;}
.guest-vidhi-track-empty{font-size:12.5px; color:var(--g-ink-faint); padding:4px 0;}
.guest-vidhi-track-row.is-current{position:relative; margin:0 -18px; padding:6px 18px; background:color-mix(in srgb,var(--g-coral) 7%,transparent);}
.guest-vidhi-track{position:relative;}
.guest-vidhi-track-row.is-current::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--g-coral-dim);}
.guest-vidhi-track-row.is-current .guest-vidhi-track-time{color:var(--g-coral-dim);}
.guest-vidhi-track-row.is-current .guest-vidhi-track-title{font-weight:650;}
.guest-vidhi-bridge{
  display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap; gap:8px;
  padding:12px 18px; border-top:1px solid var(--g-line); background:var(--g-bg);
  font-size:12.5px; color:var(--g-ink-dim); text-align:center;
}
.guest-vidhi-bridge-time{font-weight:700; color:var(--g-gold-dim);}

.guest-footer{
  margin-top:auto; text-align:center; padding:44px 20px 36px; border-top:1px solid var(--g-line);
}
.guest-footer-mark{font-family:var(--g-serif); font-size:16px; color:var(--g-ink);}
.guest-footer-date{font-size:12px; color:var(--g-ink-faint); margin-top:4px;}
.guest-team-link{
  margin-top:10px; background:none; border:none; color:var(--g-ink-faint); font-size:11.5px;
  letter-spacing:.05em; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  padding:12px 8px; /* discreet in size/weight but still a full mobile-friendly tap target (req 7) */
}

/* GUEST DEMO CLOCK (2026-08-29): opt-in preview control (?demo=1 only —
   see isPreviewMode() in guest-app.js), styled with the same restraint as
   the rest of the guest footer so it reads as a developer/family tool,
   never as a guest-facing feature. A native <details>/<summary> disclosure
   (same pattern as .guest-moment-detail) so no extra JS is needed for
   open/close. Every interactive element is sized to a >=44px tap target
   and the panel is width-capped and box-sizing:border-box so it can never
   cause horizontal overflow at 360-430px. */
.guest-demo-clock{margin-top:18px; display:inline-block; max-width:100%; text-align:left;}
.guest-demo-clock summary{
  display:inline-flex; align-items:center; gap:7px; list-style:none; cursor:pointer;
  min-height:44px; padding:10px 16px; border-radius:999px; border:1px solid var(--g-line);
  background:var(--g-card); color:var(--g-ink-dim); font-size:12px; font-weight:700; letter-spacing:.02em;
}
.guest-demo-clock summary::-webkit-details-marker{display:none;}
.guest-demo-badge-dot{width:6px; height:6px; border-radius:50%; background:var(--g-coral); flex-shrink:0;}
.guest-demo-clock-panel{
  margin:10px auto 0; padding:14px; max-width:280px; width:calc(100vw - 40px); box-sizing:border-box;
  border:1px solid var(--g-line); border-radius:14px; background:var(--g-card);
  display:flex; flex-direction:column; gap:8px;
}
.guest-demo-clock-panel label{
  font-size:10.5px; font-weight:700; color:var(--g-ink-faint); text-transform:uppercase; letter-spacing:.05em;
}
.guest-demo-clock-panel select, .guest-demo-clock-panel input{
  width:100%; box-sizing:border-box; min-height:44px; padding:8px 12px; border-radius:10px;
  border:1px solid var(--g-line); background:var(--g-bg); color:var(--g-ink); font:inherit; font-size:14px;
}
.guest-demo-clock-actions{display:flex; gap:8px; margin-top:2px;}
.guest-demo-btn{
  flex:1; min-height:44px; min-width:0; border-radius:10px; border:1px solid var(--g-line);
  background:var(--g-bg); color:var(--g-ink); font:inherit; font-weight:700; font-size:13px; cursor:pointer;
}
.guest-demo-btn:hover{border-color:var(--g-coral-dim); color:var(--g-coral-dim);}

@media (min-width:700px){
  .guest-details-grid{grid-template-columns:repeat(4,1fr);}
  .guest-details-grid:has(.guest-detail:only-child){grid-template-columns:1fr;}
}
/* Guest home: a single editorial focal point, then one useful action,
   then quiet supporting links. Shared by every event and preview state. */
#guest-view-home .guest-hero{max-width:800px;padding:68px 32px 34px;}
#guest-view-home .guest-hero-title{font-size:clamp(34px,4.4vw,58px);line-height:1.12;max-width:740px;margin:0 auto 16px;text-wrap:balance;}
#guest-view-home .guest-hero-eyebrow{font-size:11px;letter-spacing:.19em;margin-bottom:18px;}
#guest-view-home .guest-hero-date{font-size:15px;line-height:1.65;}
#guest-view-home .guest-hero-next{display:block;width:fit-content;max-width:100%;box-sizing:border-box;margin:20px auto 0;padding:12px 20px;border-top:1px solid var(--g-line);font-size:14px;line-height:1.5;}
#guest-view-home .guest-live-photo-wrap,#guest-view-home .guest-actions-pair{max-width:740px;}
#guest-view-home .guest-live-photo-card{background:var(--g-card);border:1px solid var(--g-line);padding:22px 28px;box-shadow:0 12px 40px -28px var(--g-ink);}
#guest-view-home .guest-live-photo-icon{display:none;}
#guest-view-home .guest-live-photo-card h2{font-size:24px;margin:10px 0 8px;}
#guest-view-home .guest-live-photo-card p{max-width:470px;font-size:14px;margin-bottom:18px;}
#guest-view-home .guest-live-photo-button{max-width:440px;margin:0 auto;min-height:48px;font-weight:650;}
#guest-view-home .guest-actions-pair{gap:0;padding-bottom:18px;}
#guest-view-home .guest-action-card,#guest-view-home .guest-action-card.is-photo{border:0;background:none;box-shadow:none;border-radius:0;padding:18px 12px;}
#guest-view-home .guest-action-icon-badge{display:none;}
#guest-view-home .guest-action-title{font-size:14px;}
#guest-view-home .guest-action-card.is-photo{border-left:1px solid var(--g-line);}
#guest-view-home .guest-section{padding-top:22px;}
#guest-view-home .guest-vidhi-module{box-shadow:none;border-radius:12px;}
#guest-view-home .guest-vidhi-now{font-size:17px;line-height:1.5;}
#guest-view-home .guest-vidhi-next{line-height:1.6;}
#guest-view-home .guest-vidhi-module-label{font-size:10px;letter-spacing:.14em;}
